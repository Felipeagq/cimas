version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 exige Node >= 20.9; fijamos la versión del .nvmrc
        - nvm install
        - nvm use
        - node --version
        - npm ci
    build:
      commands:
        # Falla el despliegue si hay un asset truncado, una imagen sin registrar o un enlace roto
        - npm run check:content
        # `next build` genera `.next`, que es lo que Amplify Hosting (WEB_COMPUTE) publica
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
